# Runs the same gates CI runs, before the push instead of after it. Install once:
#   uv run pre-commit install
# CI stays the source of truth — this only moves the feedback earlier. mypy is deliberately NOT a
# hook: it needs the full dependency set resolved and takes long enough that people start passing
# --no-verify, which costs more than it saves.
repos:
  # ruff and black run through `uv run`, i.e. the versions uv.lock pins and CI installs with
  # `uv sync --frozen` — literally the same binaries as the gate. Pinned `rev:`s drifted instead: the
  # hooks held black 25.9.0 / ruff v0.14.4 while the lock resolved black 26.5.1 / ruff 0.16.3, so a
  # file the hook had just formatted could be rejected by `uv run black --check .` seconds later. A
  # rev bump only postpones that to the next lock update; there is no version here to drift.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (uv.lock version)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # black owns formatting in this repo (line-length 120 in pyproject), so ruff-format never runs.
      - id: black
        name: black (uv.lock version)
        entry: uv run black
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # config-template.yaml and the CI workflow are both YAML that must stay parseable.
        exclude: ^cdk\.out/
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]  # the diagram PNGs are legitimately large
      - id: detect-private-key

  - repo: local
    hooks:
      # The image installs from uv.lock; a pyproject edit that isn't relocked ships a dependency
      # set nobody tested. CI checks this too — this just fails it before the push.
      - id: uv-lock-current
        name: uv.lock is current with pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

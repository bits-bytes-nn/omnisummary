# OmniSummary Configuration Template
# Copy to config.yaml and fill in your values.

collectors:
  youtube:
    enabled: true
    # Lists must stay valid YAML lists — a key with only a commented-out entry under it parses as
    # null and fails config validation, so keep the `[]` and add entries inside it.
    channels: []
      # - "https://www.youtube.com/@channel_name"
    max_videos_per_channel: 3
    lookback_hours: 24
    # Channels collected at once (each parks worker threads for the scrape/transcript fetches);
    # same bound as rss.max_concurrency.
    max_concurrency: 5
    # YouTube/X items are collected locally (residential IP) and parked in S3; beyond this age the
    # parked items are still used but the source is reported STALE, so a stopped local cron alerts
    # instead of looking healthy. Every collector inherits this key.
    park_max_age_hours: 36
  reddit:
    enabled: true
    subreddits: []
      # - "subreddit_name"
    sort: hot
    limit: 20
    lookback_hours: 24
  rss:
    enabled: true
    feeds: []
      # - "https://example.substack.com/feed"
    lookback_hours: 24
    # Each feed parse parks a worker thread; keep this at/below the asyncio executor width so a
    # feed's timeout measures its fetch, not its wait in the queue.
    max_concurrency: 5
  web_search:
    enabled: true
    trend_searches:
      - name: frontier_models
        queries:
          - "frontier AI model release GPT Claude Gemini Llama"
          - "LLM benchmark SOTA new results"
        topic: news
      - name: research
        queries:
          - "AI research paper NeurIPS ICML ICLR arXiv"
          - "machine learning new technique architecture"
        topic: news
      - name: industry
        queries:
          - "AI startup funding acquisition strategy"
          - "AI policy regulation open source"
        topic: news
      - name: tools_infra
        queries:
          - "ML inference optimization deployment tool"
          - "AI developer tools framework release"
        domains: ["arxiv.org", "github.com", "huggingface.co"]
        topic: general
    max_results_per_query: 10
    lookback_hours: 72
    refine_model: "anthropic.claude-sonnet-5"
    max_refine_queries: 3
    # Search queries in flight at once; unbounded fan-out self-throttled and lost whole queries.
    max_concurrency: 5
  rsshub:
    enabled: false
    base_url: "http://localhost:1200"
    accounts: []
      # - username: "karpathy"
      #   platform: x
    lookback_hours: 72
    max_concurrency: 5

pipeline:
  top_n: 5
  min_score: 0.6
  # Where the AGI-countdown gag sits in the lead: "prefix" spends the Threads root's FIRST line —
  # the only line most feed readers see — on the same fixed sentence every day. "suffix" keeps the
  # gag verbatim but moves it to a closing line, so the first line is the day's actual angle.
  agi_countdown_position: "suffix"
  ranking_model: "anthropic.claude-opus-4-8"
  digest_model: "anthropic.claude-sonnet-5"
  item_text_max_tokens: 10000
  # Ranking robustness: cap the in-flight Bedrock batches (a big day self-throttled otherwise) and
  # retry a failed batch instead of silently dropping its whole slice of candidates.
  ranking_max_concurrency: 4
  ranking_max_retries: 3
  ranking_retry_backoff_sec: 5
  # Below this share of a batch actually scored, the omitted items get ONE extra re-ask (the
  # shortfall is logged either way). Full coverage — the normal case — costs no extra call.
  ranking_min_coverage_ratio: 0.9
  source_slots:
    web: 1
    x: 1
    rss: 1
    reddit: 1
    youtube: 1
  origin_weight_default: 1.0
  origin_weights: {}
    # Per-origin weight multiplier. Key = X handle, channel URL, subreddit, or feed URL.
  trend_model: "anthropic.claude-sonnet-5"
  trend_retention_days: 30
  trend_cooling_days: 7
  trend_max_evidence: 5
  trend_max_active_trends: 10
  trend_momentum_half_life_days: 7.0

  # --- Delivery (values below are the code defaults) ---
  # Slack is posted by the digest Lambda. Threads is posted by the DAILY VISUAL Lambda (the image
  # and the text ship as one post set), so Threads delivery also needs enable_daily_visual: true.
  enable_slack_post: true
  enable_threads_post: false

  # --- Daily visual (values below are the code defaults) ---
  enable_daily_visual: true
  image_model: "gpt-image-2"
  # orientation -> gpt-image size; the editor picks the orientation that fits each visual.
  image_sizes:
    square: "1024x1024"
    landscape: "1536x1024"
    portrait: "1024x1536"
  # Bound the gpt-image HTTP call: the SDK defaults (600s x 2 retries) can outlive the visual
  # Lambda's 15-minute budget.
  visual_image_timeout_sec: 300
  visual_image_max_retries: 0
  # Cap on the research steps the visual editor may request (each is a live search call); matches
  # the "1-3 steps" its prompt asks for.
  visual_research_max_steps: 3
  # How many recent visuals to track for deliberate variation (orientation + format), and the soft
  # targets the editor is nudged toward. 0 disables a nudge entirely.
  visual_format_window: 6
  visual_multi_panel_target_ratio: 0.34
  visual_character_enabled: true
  visual_character_target_ratio: 0.5

agent:
  model_id: "anthropic.claude-sonnet-5"

slack:
  bot_token: ""    # Or set SLACK_BOT_TOKEN env var
  channel_id: ""   # Or set SLACK_CHANNEL_ID env var

aws:
  region: "ap-northeast-2"
  bedrock_region: "us-west-2"
  profile: ""
  project_name: "omnisummary"
  stage: "dev"
  vpc_id: ""               # Leave empty to create new VPC
  subnet_ids: []           # Leave empty to use default private subnets
  state_bucket_name: ""    # Leave empty to create new S3 bucket
  s3_prefix: ""            # S3 key prefix (e.g., "omnisummary")
  # Running tasks for the RSSHub Fargate service. 0 because the digest reads X items from the
  # S3 park file (refreshed by the local sync cron) and never reaches the service; raise to 1
  # to restore the in-AWS fallback. The task definition is deployed either way.
  rsshub_desired_count: 0

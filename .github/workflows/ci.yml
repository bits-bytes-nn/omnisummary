name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.5.11"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install 3.12
      # Fail if uv.lock is out of date with pyproject.toml instead of silently resolving
      # something newer than what was reviewed/tested.
      - name: Check lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Black format check
        run: uv run black --check .
      # Type-check the WHOLE repo (excludes live in [tool.mypy] exclude: references, tests,
      # cdk.out, node_modules). The old explicit path list silently left new top-level modules
      # and scripts/ unchecked.
      - name: Mypy type-check
        run: uv run mypy .

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # Coverage scope and the fail-under threshold live in pyproject ([tool.coverage.*]) so the
      # gate can't be narrowed by editing a command line, and a new module is covered by default.
      - name: Run tests with coverage
        run: >
          uv run python -m pytest tests/
          --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  synth:
    name: CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `npm ci` only — the `|| npm install` fallback silently ignored a stale/absent
      # package-lock.json and installed a different CDK CLI than the pinned one, defeating the
      # point of exercising the CLI<->aws-cdk-lib schema handshake.
      - name: Install pinned CDK CLI
        run: npm ci
      # Run synth through the repo-pinned CDK CLI (not a bare app.synth()) so the CLI↔aws-cdk-lib
      # cloud-assembly schema handshake is exercised — the exact drift that broke a deploy in 2026-07.
      - name: Synthesize CDK via pinned CLI (offline)
        run: npx cdk synth -a "uv run python scripts/ci_synth.py"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build digest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          push: false
          tags: omnisummary-digest:ci
      # Build the agentcore image so a missing COPY or unresolved dep in the deep-research
      # runtime is caught in CI rather than at AgentCore cold-start. The runtime's import graph
      # (agent_runtime.app -> output.delivery -> shared.research/media) is separately exercised
      # by tests/test_agentcore_app.py on the host.
      - name: Build agentcore image (deep-research runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agentcore
          platforms: linux/arm64
          provenance: false
          push: false
          tags: omnisummary-agentcore:ci

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.5.11"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    # Every job carries a timeout: without one a hung step burns the full 6h runner default
    # before anyone notices the build is stuck rather than slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          # Cache the resolved wheels, keyed on the lockfile — a dependency change still
          # reinstalls, so the cache can never hide a broken/unlockable dependency set.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # No version argument: the tracked .python-version is the single pin, so CI, the Docker images
      # and a developer's venv cannot drift onto different minor versions.
      - name: Set up Python
        run: uv python install
      # Fail if uv.lock is out of date with pyproject.toml instead of silently resolving
      # something newer than what was reviewed/tested.
      - name: Check lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Black format check
        run: uv run black --check .
      # Type-check the WHOLE repo (excludes live in [tool.mypy] exclude: references, tests,
      # cdk.out, node_modules). The old explicit path list silently left new top-level modules
      # and scripts/ unchecked.
      - name: Mypy type-check
        run: uv run mypy .

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # No version argument: the tracked .python-version is the single pin, so CI, the Docker images
      # and a developer's venv cannot drift onto different minor versions.
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # Coverage scope and the fail-under threshold live in pyproject ([tool.coverage.*]) so the
      # gate can't be narrowed by editing a command line, and a new module is covered by default.
      - name: Run tests with coverage
        run: >
          uv run python -m pytest tests/
          --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      # The Cloudflare worker is the only internet-reachable component in the repo, and Python can
      # only grep its source. Its real branches (token, URL parse, scheme, suffix host match, fixed
      # outbound headers) are asserted by node:test — stdlib only, so there is nothing to install.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `ls` first: `node --test` on a pattern that matches nothing exits 0, so a deleted or
      # renamed suite would otherwise pass green.
      - name: Test the Cloudflare worker
        run: |
          ls cloudflare-proxy/test/*.test.js
          node --test cloudflare-proxy/test/*.test.js

  synth:
    name: CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # No version argument: the tracked .python-version is the single pin, so CI, the Docker images
      # and a developer's venv cannot drift onto different minor versions.
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # `npm ci` only — the `|| npm install` fallback silently ignored a stale/absent
      # package-lock.json and installed a different CDK CLI than the pinned one, defeating the
      # point of exercising the CLI<->aws-cdk-lib schema handshake.
      - name: Install pinned CDK CLI
        run: npm ci
      # Run synth through the repo-pinned CDK CLI (not a bare app.synth()) so the CLI↔aws-cdk-lib
      # cloud-assembly schema handshake is exercised — the exact drift that broke a deploy in 2026-07.
      # scripts/ci_synth.py synths the TRACKED config/config-template.yaml (config.yaml is
      # gitignored, so Config.load() here would silently synth bare code defaults) with a dummy
      # account, so this needs no AWS credentials.
      - name: Synthesize CDK via pinned CLI (offline)
        run: npx cdk synth -a "uv run python scripts/ci_synth.py"

  docker:
    name: Docker build & import check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # load: true (single platform, native amd64) so the built image is in the local daemon and
      # can actually be RUN — a build alone never executes an import, so a missing COPY or a
      # module that only resolves on the developer's machine still shipped green.
      - name: Build digest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          load: true
          tags: omnisummary-digest:ci
          cache-from: type=gha,scope=digest
          cache-to: type=gha,mode=max,scope=digest
      # Runs on the loaded image regardless of how much of the build was cached, so layer caching
      # cannot skip this check. --network none + no credentials: importing a handler must be pure,
      # so an import-time AWS call or HTTP fetch fails here instead of at cold start.
      - name: Import-check digest image
        run: >
          docker run --rm --network none --entrypoint python omnisummary-digest:ci -c
          "import lambda_handlers.digest_handler, lambda_handlers.visual_handler,
          lambda_handlers.threads_refresh_handler, main; print('digest image imports OK')"
      # The agentcore image is deployed as arm64, but CI builds it amd64: the base image and every
      # dependency are multi-arch, and a native build keeps the import check runnable without QEMU
      # emulation (a QEMU pip install blows the job budget). What this catches is arch-independent
      # — a missing COPY or an unresolved dep in the deep-research runtime.
      - name: Build agentcore image (deep-research runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agentcore
          platforms: linux/amd64
          provenance: false
          load: true
          tags: omnisummary-agentcore:ci
          cache-from: type=gha,scope=agentcore
          cache-to: type=gha,mode=max,scope=agentcore
      - name: Import-check agentcore image
        run: >
          docker run --rm --network none --entrypoint python omnisummary-agentcore:ci -c
          "import agent_runtime.app; print('agentcore image imports OK')"

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: gitleaks scans commits, and a shallow clone would only ever look at the tip,
      # so a key committed earlier and removed later would never be found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # No version argument: the tracked .python-version is the single pin, so CI, the Docker images
      # and a developer's venv cannot drift onto different minor versions.
      - name: Set up Python
        run: uv python install
      # Install the EXACT set uv.lock pins — the same set the Docker images install — rather than
      # re-resolving pyproject's ranges, which would audit versions that never ship.
      # --no-install-project deliberately leaves the local package out: pip-audit reports an
      # editable distribution as unauditable, and --strict turns that into a failure.
      - name: Install the locked dependency set
        run: uv sync --frozen --no-dev --no-install-project
      # Audit the INSTALLED venv by path rather than an exported requirements file. Two things made
      # this step fail before it had ever audited anything: `uvx pip-audit==2.9.0` is not a valid
      # spec for the pinned uv 0.5.11 (it needs `--from`), and pip-audit's `-r` mode builds its own
      # venv via `ensurepip`, which uv-managed standalone Pythons do not ship (exit 127).
      # Verified in both directions against uv 0.5.11: clean on this lockfile, and failing on the
      # previous one (19 packages with advisories) — a gate that cannot fail is not a gate.
      #
      # The path is DERIVED, and asserted non-empty: pip-audit against a nonexistent --path prints
      # "No known vulnerabilities found" and exits 0, so the hardcoded `python3.12` was the only thing
      # keeping this gate real — and until .python-version was tracked, nothing pinned that minor
      # version. A silent interpreter bump would have turned the whole step into a no-op.
      - name: Locate the installed dependency set
        id: sitepackages
        run: |
          purelib="$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          test -d "$purelib"
          test -n "$(ls -A "$purelib")"
          echo "purelib=$purelib" >> "$GITHUB_OUTPUT"
      - name: Audit locked dependencies for known vulnerabilities
        run: >
          uvx --from pip-audit==2.9.0 pip-audit --strict
          --path "${{ steps.sitepackages.outputs.purelib }}"
      # Secrets: the CloudFormation template used to carry live API tokens in plaintext, and
      # config/config.yaml (gitignored) holds real values — a mis-added file is a live leak.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

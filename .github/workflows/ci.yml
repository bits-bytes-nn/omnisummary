name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a new advisory against an unchanged uv.lock still fails pip-audit.
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.6.14"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    # Every job carries a timeout: without one a hung step burns the full 6h runner default
    # before anyone notices the build is stuck rather than slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}
          # Cache the resolved wheels, keyed on the lockfile — a dependency change still
          # reinstalls, so the cache can never hide a broken/unlockable dependency set.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # No version argument: the tracked .python-version is the single pin, so CI, the Docker images
      # and a developer's venv cannot drift onto different minor versions.
      - name: Set up Python
        run: uv python install
      # Fail if uv.lock is out of date with pyproject.toml instead of silently resolving
      # something newer than what was reviewed/tested.
      - name: Check lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Black format check
        run: uv run black --check .
      # Type-check the WHOLE repo (excludes live in [tool.mypy] exclude: references, tests,
      # cdk.out, node_modules). The old explicit path list silently left new top-level modules
      # and scripts/ unchecked.
      - name: Mypy type-check
        run: uv run mypy .

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # No version argument: the tracked .python-version is the single pin, so CI, the Docker images
      # and a developer's venv cannot drift onto different minor versions.
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # Coverage scope and the fail-under threshold live in pyproject ([tool.coverage.*]) so the
      # gate can't be narrowed by editing a command line, and a new module is covered by default.
      - name: Run tests with coverage
        run: >
          uv run python -m pytest tests/
          --cov --cov-report=term-missing

  synth:
    name: CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # No version argument: the tracked .python-version is the single pin, so CI, the Docker images
      # and a developer's venv cannot drift onto different minor versions.
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      # `npm ci` only — the `|| npm install` fallback silently ignored a stale/absent
      # package-lock.json and installed a different CDK CLI than the pinned one, defeating the
      # point of exercising the CLI<->aws-cdk-lib schema handshake.
      - name: Install pinned CDK CLI
        run: npm ci
      # Run synth through the repo-pinned CDK CLI (not a bare app.synth()) so the CLI↔aws-cdk-lib
      # cloud-assembly schema handshake is exercised — the exact drift that broke a deploy in 2026-07.
      # scripts/ci_synth.py synths the TRACKED config/config-template.yaml (config.yaml is
      # gitignored, so Config.load() here would silently synth bare code defaults) with a dummy
      # account, so this needs no AWS credentials.
      - name: Synthesize CDK via pinned CLI (offline)
        run: npx cdk synth -a "uv run python scripts/ci_synth.py"

  docker:
    name: Docker build & import check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # load: true (single platform, native amd64) so the built image is in the local daemon and
      # can actually be RUN — a build alone never executes an import, so a missing COPY or a
      # module that only resolves on the developer's machine still shipped green.
      - name: Build digest image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          load: true
          tags: omnisummary-digest:ci
          cache-from: type=gha,scope=digest
          cache-to: type=gha,mode=max,scope=digest
      # Runs on the loaded image regardless of how much of the build was cached, so layer caching
      # cannot skip this check. --network none + no credentials: importing a handler must be pure,
      # so an import-time AWS call or HTTP fetch fails here instead of at cold start.
      - name: Import-check digest image
        run: >
          docker run --rm --network none --entrypoint python omnisummary-digest:ci -c
          "import lambda_handlers.digest_handler, lambda_handlers.visual_handler,
          lambda_handlers.threads_refresh_handler; print('digest image imports OK')"
      # Importing the handlers never loads a config, so green CI did not imply a DEPLOYABLE image:
      # config/config.yaml is gitignored and the Dockerfile COPYs config/, so the image CI validates
      # resolved to bare code defaults — empty source lists, region us-east-1 — and started up
      # happily. Loading the config here fails the BUILD instead, on a missing COPY, a config the
      # image cannot validate, or a Config.load() that has nothing to fall back to.
      #
      # trend_searches, NOT rss.feeds: the template deliberately ships no live source lists (a
      # template must not start collecting from someone else's feeds), but it does carry the trend
      # searches, and their code default is empty. So this is non-vacuous on a clean checkout and
      # still fails the moment the image resolves to bare defaults. The remaining gap — proving the
      # image carries the OPERATOR's feeds — cannot be closed while config.yaml is untracked.
      - name: Config-check digest image
        run: >
          docker run --rm --network none --entrypoint python omnisummary-digest:ci -c
          "from shared import Config; c = Config.load();
          assert c.collectors.web_search.trend_searches, 'the image resolved to bare code defaults';
          assert __import__('pathlib').Path(c.pipeline.visual_character_reference).is_file(), 'persona sheet missing';
          print('digest image config loads OK:', c.aws.region, c.pipeline.digest_model.value)"

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: gitleaks scans commits, and a shallow clone would only ever look at the tip,
      # so a key committed earlier and removed later would never be found.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # No version argument: the tracked .python-version is the single pin, so CI, the Docker images
      # and a developer's venv cannot drift onto different minor versions.
      - name: Set up Python
        run: uv python install
      # Install the EXACT set uv.lock pins — the same set the Docker images install — rather than
      # re-resolving pyproject's ranges, which would audit versions that never ship.
      # --no-install-project deliberately leaves the local package out: pip-audit reports an
      # editable distribution as unauditable, and --strict turns that into a failure.
      - name: Install the locked dependency set
        run: uv sync --frozen --no-dev --no-install-project
      # Audit the INSTALLED venv by path: pip-audit's `-r` mode builds its own venv via `ensurepip`,
      # which uv-managed Pythons do not ship. The path is derived and asserted non-empty, because
      # pip-audit against a nonexistent --path reports "No known vulnerabilities found" and exits 0.
      - name: Locate the installed dependency set
        id: sitepackages
        run: |
          purelib="$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          test -d "$purelib"
          test -n "$(ls -A "$purelib")"
          echo "purelib=$purelib" >> "$GITHUB_OUTPUT"
      - name: Audit locked dependencies for known vulnerabilities
        run: >
          uvx --from pip-audit==2.9.0 pip-audit --strict
          --path "${{ steps.sitepackages.outputs.purelib }}"
      # Secrets: the CloudFormation template used to carry live API tokens in plaintext, and
      # config/config.yaml (gitignored) holds real values — a mis-added file is a live leak.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
